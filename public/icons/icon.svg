<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E1E1E" stroke-width="2"/>
    </pattern>
    <!-- Glove hand, same mitt shape as the exercise figures -->
    <path id="mitt" d="M-3.5,-3.2 L2.8,-3.2 Q4.2,-3.2 4.2,-1.6 L4.2,1.8 Q4.2,3.4 2.6,3.4 L-3.5,3.4 Z M-0.6,3.4 L1.6,6.2"
      fill="#0B0B0B" stroke="#E8402F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  </defs>
  <rect width="512" height="512" fill="#0B0B0B"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- Figure scaled into the maskable safe zone -->
  <g transform="translate(256 270) scale(0.8) translate(-256 -256)">
    <polygon points="196,250 316,250 300,430 212,430" fill="#0B0B0B" stroke="#EDEBE6" stroke-width="12" stroke-linejoin="miter"/>
    <line x1="256" y1="250" x2="256" y2="212" stroke="#EDEBE6" stroke-width="12"/>
    <circle cx="256" cy="160" r="54" fill="#0B0B0B" stroke="#EDEBE6" stroke-width="12"/>

    <!-- Arms up in a Y: the working limbs, in red -->
    <g stroke="#E8402F" stroke-width="12" stroke-linecap="round">
      <line x1="316" y1="262" x2="380" y2="196"/>
      <line x1="380" y1="196" x2="396" y2="110"/>
      <line x1="196" y1="262" x2="132" y2="196"/>
      <line x1="132" y1="196" x2="116" y2="110"/>
    </g>
    <use href="#mitt" transform="translate(402 77.6) rotate(-79.5) scale(5.5)"/>
    <use href="#mitt" transform="translate(110 77.6) rotate(-100.5) scale(5.5 -5.5)"/>

    <g fill="#0B0B0B" stroke="#E8402F" stroke-width="10">
      <circle cx="316" cy="262" r="16"/>
      <circle cx="196" cy="262" r="16"/>
      <circle cx="380" cy="196" r="14"/>
      <circle cx="132" cy="196" r="14"/>
      <circle cx="396" cy="110" r="11"/>
      <circle cx="116" cy="110" r="11"/>
    </g>
  </g>
</svg>
